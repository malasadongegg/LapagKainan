<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0038a8">
<title>LapagKainan — Hidden food exists somewhere</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#map"><span>🍜</span> Lapag<b>Kainan</b></a>
  <form id="searchForm" class="search" autocomplete="off">
    <input id="q" type="search" placeholder="Saan tayo kakain? pares, silog, Bulacan…" aria-label="Search">
  </form>
  <nav class="deskNav">
    <a href="#map" data-nav="map">Map</a><a href="#discover" data-nav="discover">Discover</a>
    <a href="#saved" data-nav="saved">Saved</a>
  </nav>
  <button id="lapagTop" class="btn primary lapagTop">➕ Lapag</button>
  <button id="authBtn" class="btn ghost">Log in</button>
</header>

<main>
  <section id="view-map" class="view">
    <aside id="filters" class="filters">
      <div class="fhead"><h3>Filters</h3><button class="btn ghost small" id="filtersClose">Done</button></div>
      <label>Distance
        <select id="fRadius">
          <option value="0">Anywhere in view</option><option value="500">Within 500 m</option><option value="1000">Within 1 km</option>
          <option value="3000">Within 3 km</option><option value="5000">Within 5 km</option><option value="custom">Custom…</option>
        </select>
      </label>
      <label id="customRadiusWrap" hidden>Radius (km)<input id="fCustom" type="number" min="0.1" step="0.1" value="2"></label>
      <fieldset><legend>Price</legend><div id="fPrice" class="chips"></div></fieldset>
      <fieldset><legend>Category / cuisine</legend><div id="fTags" class="chips"></div></fieldset>
      <fieldset><legend>Minimum rating</legend>
        <label class="inline">Food <select data-min="food"></select></label>
        <label class="inline">Value <select data-min="value"></select></label>
        <label class="inline">Service <select data-min="service"></select></label>
        <label class="inline">Cleanliness <select data-min="cleanliness"></select></label>
      </fieldset>
      <label class="check"><input id="fVerified" type="checkbox"> 🟢 Has verified visits</label>
      <label class="check"><input id="fRecent" type="checkbox"> 🆕 Recently discovered</label>
      <label class="check"><input id="fInactive" type="checkbox"> Show 🔴 inactive</label>
      <button class="btn ghost" id="fReset">Reset</button>
    </aside>
    <div class="mapArea">
      <div id="map"></div>
      <div class="mapBar">
        <button class="btn small" id="filtersOpen">⚙️ Filters <span id="fCount"></span></button>
        <div class="seg" id="modeSeg">
          <button data-mode="map">Map</button><button data-mode="hybrid" class="on">Hybrid</button><button data-mode="list">List</button>
        </div>
        <button class="btn small" id="locateBtn">📍 Near me</button>
      </div>
      <div id="geoHint" class="geoHint" hidden></div>
      <div id="cards" class="cards"></div>
    </div>
  </section>

  <section id="view-discover" class="view page" hidden></section>
  <section id="view-saved" class="view page" hidden></section>
  <section id="view-profile" class="view page" hidden></section>
</main>

<nav class="bottomNav">
  <a href="#map" data-nav="map"><i>🗺️</i>Map</a>
  <a href="#discover" data-nav="discover"><i>🔥</i>Discover</a>
  <button id="lapagBtn" class="lapagFab" aria-label="Lapag"><i>➕</i>Lapag</button>
  <a href="#saved" data-nav="saved"><i>🔖</i>Saved</a>
  <a href="#profile" data-nav="profile"><i>👤</i>Profile</a>
</nav>

<div id="sheet" class="sheet" hidden><div class="sheetBody"></div></div>
<div id="modal" class="modal" hidden><div class="modalBody"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
